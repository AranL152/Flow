# Deployed under the name the Rust base10-worker used, so the URL baked into
# flow-core (providers/auto.rs) keeps resolving after this worker takes over.
name = "base10-proxy"
main = "src/index.ts"
compatibility_date = "2024-06-01"
compatibility_flags = ["nodejs_compat"]

[observability]
[observability.logs]
enabled = true
invocation_logs = true

[ai]
binding = "AI"
